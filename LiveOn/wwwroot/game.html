<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生存面板 - LiveOn</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-dark" style="background-color: #1e2718;">
            <div class="container-fluid">
                <a class="navbar-brand" href="/game.html">LiveOn</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link" href="/game.html">生存面板</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/Home/Logout">退出</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container-fluid px-3 py-2 flex-grow-1">
        <main role="main">
            <!-- 顶部状态栏 -->
            <div class="game-status-bar d-flex justify-content-between align-items-center px-3 py-2 mb-2">
                <div class="d-flex align-items-center gap-3">
                    <span class="game-title">LiveOn</span>
                    <span class="badge bg-game-status" id="gameStateBadge">加载中</span>
                </div>
                <div class="d-flex align-items-center gap-4">
                    <div class="game-time">
                        <span id="gameDate">0001-01-01 06:00:00</span>
                    </div>
                    <div class="game-controls">
                        <button class="btn btn-game-start" id="btnStartGame">开始游戏</button>
                        <button class="btn btn-game-pause d-none" id="btnPause">暂停</button>
                        <button class="btn btn-game-resume d-none" id="btnResume">继续</button>
                    </div>
                </div>
            </div>

            <!-- 主面板 -->
            <div class="row g-2" style="height: calc(100vh - 80px);">
                <!-- 左侧：区块面板 -->
                <div class="col-lg-8 d-flex flex-column">
                    <div class="game-panel flex-grow-1">
                        <div class="panel-header">
                            <h6>地块一览</h6>
                            <span class="text-muted" id="blockCount">0 块</span>
                        </div>
                        <div class="panel-body">
                            <div class="block-grid" id="blockGrid"></div>
                        </div>
                    </div>
                </div>

                <!-- 右侧面板 -->
                <div class="col-lg-4 d-flex flex-column gap-2">
                    <!-- 物品栏 -->
                    <div class="game-panel">
                        <div class="panel-header">
                            <h6>背包</h6>
                            <span class="text-muted" id="itemCount">0 件</span>
                        </div>
                        <div class="panel-body">
                            <div id="itemList" class="item-list"></div>
                        </div>
                    </div>

                    <!-- 操作日志 -->
                    <div class="game-panel flex-grow-1">
                        <div class="panel-header">
                            <h6>日志</h6>
                            <div class="d-flex gap-2">
                                <a href="/logs.html" class="btn btn-sm btn-link text-muted" id="btnMoreLogs">更多</a>
                                <button class="btn btn-sm btn-link text-muted" id="btnClearLog">清空</button>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div id="logContainer" class="log-container"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 区块详情模态框 -->
            <div class="modal fade" id="blockModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content game-modal">
                        <div class="modal-header">
                            <h5 class="modal-title" id="blockModalTitle">区块详情</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="blockModalBody"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/lib/jquery/dist/jquery.min.js"></script>
    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
</body>
</html>
